name: CI (Simple)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**/CMakeLists.txt'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.swift'
      - '**/*.m'
      - '**/*.metal'
      - '**/*.comp'
      - '**/*.glsl'
      - '**/*.wgsl'
      - '.github/workflows/ci-simple.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1

jobs:
  ubuntu-cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ubuntu-cpu-x64-fork
          evict-old-files: 1d

      - name: Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-dev python3-wheel \
            libjpeg-dev build-essential libssl-dev \
            git-lfs

      - name: Python Dependencies
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES="1"
          python3 -m pip install --upgrade pip setuptools
          pip3 install ./gguf-py

      - name: Build
        run: |
          cmake -B build \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DGGML_RPC=ON
          time cmake --build build --config Release -j $(nproc)

      - name: Test
        run: |
          cd build
          ctest -L main --verbose --timeout 900

      - name: Test llama2c conversion
        run: |
          cd build
          wget https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/tok512.bin
          wget https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/stories260K.bin
          ./bin/llama-convert-llama2c-to-ggml \
            --copy-vocab-from-model ./tok512.bin \
            --llama2c-model stories260K.bin \
            --llama2c-output-model stories260K.gguf
          ./bin/llama-completion -m stories260K.gguf \
            -p "One day, Lily met a Shoggoth" -n 500 -c 256
